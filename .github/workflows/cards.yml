name: Cards

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/cards.yml]

permissions:
  contents: write

concurrency: cards

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: cards/languages.svg
          base: ""
          repositories_affiliations: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_colors: "0:#f2a33a, 1:#2b7bd8, 2:#8cc4ff, 3:#d9731a, 4:#ffcf8a, 5:#e8e8e8, 6:#ffffff, 7:#1e4f99"
          plugin_languages_indepth_custom: fkie-cad/SCF, fkie-cad/encrypted-smb-forensics
          extras_css: "h2.field, section.column > small { display: none !important; } h3.field { font-size: 18px !important; } .language, .language small { font-size: 14px !important; }"
